<div class="navigation-bar">
  <div
    id="storefront-navigation"
    class="container navigation-bar__content"
    [class.is-open]="isOpen()"
  >
    <form class="mobile-search" role="search" (submit)="preventSearchNavigation($event)">
      <label class="visually-hidden" for="mobile-store-search">Search products</label>
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m16 16 4 4" />
      </svg>
      <input id="mobile-store-search" name="search" type="search" placeholder="Search" />
      <button type="submit">Search</button>
    </form>

    <nav class="primary-navigation" aria-label="Primary navigation">
      <ul role="list">
        <li>
          <a
            routerLink="/"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="notifyNavigation()"
            >Home</a
          >
        </li>
        <li>
          <a routerLink="/shop" routerLinkActive="is-active" (click)="notifyNavigation()">Shop</a>
        </li>
        <li>
          <details>
            <summary>Pages</summary>
            <ul class="pages-menu" role="list">
              <li><a routerLink="/about" (click)="notifyNavigation()">About Us</a></li>
              <li><a routerLink="/faq" (click)="notifyNavigation()">FAQs</a></li>
              <li><a routerLink="/account" (click)="notifyNavigation()">My Account</a></li>
            </ul>
          </details>
        </li>
        <li>
          <a routerLink="/about" routerLinkActive="is-active" (click)="notifyNavigation()"
            >About Us</a
          >
        </li>
        <li>
          <a routerLink="/contact" routerLinkActive="is-active" (click)="notifyNavigation()"
            >Contact Us</a
          >
        </li>
      </ul>
    </nav>

    <a class="support-phone" href="tel:+12195550114">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path
          d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c1 .3 2 .6 2.9.7a2 2 0 0 1 1.6 1.9Z"
        />
      </svg>
      <span>(219) 555-0114</span>
    </a>
  </div>
</div>
