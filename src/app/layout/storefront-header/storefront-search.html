<form class="product-search" role="search" (submit)="submit($event)">
  <label class="visually-hidden" [for]="controlId()">Search products</label>
  <svg aria-hidden="true" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7" />
    <path d="m16 16 4 4" />
  </svg>
  <input
    [id]="controlId()"
    name="search"
    type="search"
    placeholder="Search products"
    autocomplete="off"
    [value]="query()"
    (input)="updateQuery($event)"
  />
  @if (query()) {
    <button class="product-search__clear" type="button" aria-label="Clear search" (click)="clear()">
      &times;
    </button>
  }
  <button class="product-search__submit" type="submit">Search</button>
</form>
