<header class="storefront-header">
  <div class="topbar">
    <div class="container topbar__content">
      <p class="store-location">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M12 21s7-5.3 7-12a7 7 0 1 0-14 0c0 6.7 7 12 7 12Z" />
          <circle cx="12" cy="9" r="2.5" />
        </svg>
        <span>Store Location: Lincoln–344, Illinois, Chicago, USA</span>
      </p>

      <div class="topbar__meta">
        <label>
          <span class="visually-hidden">Language</span>
          <select aria-label="Language">
            <option>Eng</option>
          </select>
        </label>
        <label>
          <span class="visually-hidden">Currency</span>
          <select aria-label="Currency">
            <option>USD</option>
          </select>
        </label>
        <span class="topbar__divider" aria-hidden="true"></span>
        @if (auth.isAuthenticated()) {
          <a routerLink="/account">{{ auth.customer()?.firstName || 'My Account' }}</a>
          <span aria-hidden="true">/</span>
          <button class="topbar__action" type="button" (click)="signOut()">Sign Out</button>
        } @else {
          <a routerLink="/login">Sign In</a>
          <span aria-hidden="true">/</span>
          <a routerLink="/register">Sign Up</a>
        }
      </div>
    </div>
  </div>

  <div class="header-main">
    <div class="container header-main__content">
      <button
        class="menu-toggle"
        type="button"
        [attr.aria-label]="isMenuOpen() ? 'Close navigation' : 'Open navigation'"
        aria-controls="storefront-navigation"
        [attr.aria-expanded]="isMenuOpen()"
        (click)="toggleMenu()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          @if (isMenuOpen()) {
            <path d="m5 5 14 14M19 5 5 19" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
      </button>

      <a class="brand" routerLink="/" aria-label="Ecobazar home" (click)="closeMenu()">
        <svg class="brand__mark" aria-hidden="true" viewBox="0 0 40 34">
          <path d="M18 16C7 16 3 8 4 2c8 0 16 4 16 12v16" />
          <path d="M22 18C22 8 29 4 38 5c0 8-5 15-16 15" />
          <path d="M8 7c5 2 9 6 12 11M34 9c-5 2-9 6-12 11" />
        </svg>
        <span>Ecobazar</span>
      </a>

      <app-storefront-search
        class="search--desktop"
        controlId="desktop-store-search"
        [initialQuery]="searchTerm()"
        (searchSubmitted)="searchProducts($event)"
      />

      <div class="header-actions">
        <a class="icon-link" routerLink="/wishlist" aria-label="Wishlist">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"
            />
          </svg>
          @if (wishlist.itemCount()) {
            <span class="icon-link__count">{{ wishlist.itemCount() }}</span>
          }
        </a>
        <span class="header-actions__divider" aria-hidden="true"></span>
        <button
          class="cart-link"
          type="button"
          aria-haspopup="dialog"
          [attr.aria-expanded]="cartOpen()"
          [attr.aria-label]="cartLabel()"
          (click)="requestCart()"
        >
          <span class="cart-link__icon">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 8h12l1 13H5L6 8Z" />
              <path d="M9 9V6a3 3 0 0 1 6 0v3" />
            </svg>
            @if (shoppingCart.itemCount()) {
              <span class="cart-link__count">{{ shoppingCart.itemCount() }}</span>
            }
          </span>
          <span class="cart-link__copy">
            <small>Shopping cart:</small>
            <strong>
              {{ shoppingCart.subtotal().amount | currency: shoppingCart.subtotal().currency }}
            </strong>
          </span>
        </button>
      </div>
    </div>
  </div>

  <app-storefront-navigation
    [isOpen]="isMenuOpen()"
    [searchTerm]="searchTerm()"
    (dismissed)="closeMenu()"
    (navigated)="closeMenu()"
    (searchRequested)="searchProducts($event)"
  />
</header>
