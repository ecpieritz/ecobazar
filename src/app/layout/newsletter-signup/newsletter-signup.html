<section class="newsletter" aria-labelledby="newsletter-title">
  <div class="container newsletter__content">
    <div class="newsletter__copy">
      <h2 id="newsletter-title">Subscribe to our Newsletter</h2>
      <p>Stay up to date with seasonal produce, fresh arrivals, and exclusive offers.</p>
    </div>

    <div class="newsletter__form-area">
      <form (submit)="subscribe($event)">
        <app-form-control
          id="newsletter-email"
          label="Your email address"
          name="email"
          type="email"
          placeholder="Your email address"
          autocomplete="email"
          hideLabel
          required
          [formControl]="emailControl"
          (valueChange)="clearFeedback()"
        />
        <app-button type="submit">Subscribe</app-button>
      </form>
      <app-feedback-message tone="success" [message]="feedback()" />
    </div>

    <nav class="social-links" aria-label="Social media">
      <a href="https://www.facebook.com" target="_blank" rel="noreferrer" aria-label="Facebook">
        <span aria-hidden="true">f</span>
      </a>
      <a href="https://x.com" target="_blank" rel="noreferrer" aria-label="X">
        <span aria-hidden="true">𝕏</span>
      </a>
      <a href="https://www.pinterest.com" target="_blank" rel="noreferrer" aria-label="Pinterest">
        <span aria-hidden="true">p</span>
      </a>
      <a href="https://www.instagram.com" target="_blank" rel="noreferrer" aria-label="Instagram">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" class="fill-icon" />
        </svg>
      </a>
    </nav>
  </div>
</section>
