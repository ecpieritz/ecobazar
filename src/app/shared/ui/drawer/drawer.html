<dialog
  #dialog
  class="drawer drawer--{{ placement() }} drawer--{{ size() }}"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="description() ? descriptionId : null"
  (cancel)="handleCancel($event)"
  (pointerdown)="handleBackdrop($event)"
  (close)="handleNativeClose()"
>
  <section class="drawer__panel">
    <header class="drawer__header">
      <div>
        <h2 [id]="titleId">{{ title() }}</h2>
        @if (description(); as supportingText) {
          <p [id]="descriptionId">{{ supportingText }}</p>
        }
      </div>
      <button type="button" [attr.aria-label]="closeLabel()" (click)="requestClose('close-button')">
        <span aria-hidden="true">&times;</span>
      </button>
    </header>

    <div class="drawer__body"><ng-content /></div>
    <footer class="drawer__actions"><ng-content select="[drawerActions]" /></footer>
  </section>
</dialog>
